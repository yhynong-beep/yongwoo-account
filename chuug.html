<!doctype html>
<html lang="ko">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>🎮 추억의 게임방</title>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 25px -5px rgba(99, 102, 241, 0.15);
            --radius-lg: 16px;
            --radius-md: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }

        /* 모바일 세로 뷰어 컨테이너 */
        .mobile-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 40px rgba(0,0,0,0.08);
        }

        /* 헤더 디자인 */
        header {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            color: white;
            padding: 24px 20px 20px 20px;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.25);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .header-title {
            font-size: 22px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.5px;
        }

        .header-title i {
            color: #fbbf24;
            font-size: 24px;
        }

        .badge-count {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(4px);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .share-banner-btn {
            width: 100%;
            background-color: #fee500;
            color: #000000;
            border: none;
            padding: 12px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: transform 0.1s ease, background-color 0.2s;
            margin-top: 8px;
        }

        .share-banner-btn:active {
            transform: scale(0.98);
            background-color: #fada00;
        }

        /* 검색 & 필터 영역 */
        .controls-section {
            padding: 16px 20px 8px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
            font-size: 15px;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            border-radius: var(--radius-md);
            border: 1.5px solid var(--border-color);
            background-color: var(--card-bg);
            font-size: 14px;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        /* 카테고리 태그 스크롤 */
        .category-scroll {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
            scrollbar-width: none;
        }

        .category-scroll::-webkit-scrollbar {
            display: none;
        }

        .cat-chip {
            padding: 6px 14px;
            border-radius: 20px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-sub);
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cat-chip.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* 게임 세로 리스트 메인 영역 */
        main {
            padding: 8px 20px 40px 20px;
            flex: 1;
        }

        .game-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 게임 카드 아이템 */
        .game-item {
            background-color: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: inherit;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            transition: all 0.2s ease;
            position: relative;
        }

        .game-item:active {
            transform: scale(0.98);
            background-color: #f1f5f9;
        }

        .game-item.highlight-item {
            border: 2px solid #6366f1;
            background: linear-gradient(135deg, #ffffff 0%, #f5f3ff 100%);
            box-shadow: var(--shadow-lg);
        }

        .game-info {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 0;
        }

        .icon-box {
            width: 46px;
            height: 46px;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            flex-shrink: 0;
        }

        .game-details {
            display: flex;
            flex-direction: column;
            gap: 3px;
            min-width: 0;
        }

        .game-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .badge-top {
            background-color: #ef4444;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 800;
            line-height: 1;
        }

        .game-category {
            font-size: 12px;
            color: var(--text-sub);
            font-weight: 500;
        }

        .play-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 14px;
            transition: background-color 0.2s, color 0.2s;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .game-item:hover .play-btn {
            background-color: var(--primary);
            color: white;
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-sub);
            display: none;
        }

        .no-results i {
            font-size: 40px;
            margin-bottom: 12px;
            color: #cbd5e1;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: rgba(15, 23, 42, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: var(--text-sub);
            border-top: 1px solid var(--border-color);
            margin-top: auto;
        }
    </style>
 </head>
 <body>

   <div class="controls-section">

    </div>

   <main>

    let currentCategory = '전체';

    function renderGames(games) {
        const listContainer = document.getElementById('gameList');
        const noResults = document.getElementById('noResults');
        const gameCountBadge = document.getElementById('gameCount');

        listContainer.innerHTML = '';
        gameCountBadge.innerText = `${games.length}개`;

        if (games.length === 0) {
            noResults.style.display = 'block';
            return;
        } else {
            noResults.style.display = 'none';
        }

        games.forEach((game) => {
            const a = document.createElement('a');
            a.href = game.url;
            a.target = "_blank";
            a.rel = "noopener noreferrer";
            a.className = `game-item ${game.highlight ? 'highlight-item' : ''}`;
            
            a.innerHTML = `
                <div class="game-info">
                    <div class="icon-box" style="background: ${game.color};">
                        <i class="fa-solid ${game.icon}"></i>
                    </div>
                    <div class="game-details">
                        <div class="game-name">
                            ${game.name}
                            ${game.highlight ? '<span class="badge-top">BEST 1</span>' : ''}
                        </div>
                        <div class="game-category">#${game.cat}</div>
                    </div>
                </div>
                <div class="play-btn">
                    <i class="fa-solid fa-play"></i>
                </div>
            `;
            listContainer.appendChild(a);
        });
    }

    function setCategory(cat, element) {
        currentCategory = cat;
        document.querySelectorAll('.cat-chip').forEach(chip => chip.classList.remove('active'));
        element.classList.add('active');
        filterGames();
    }

    function filterGames() {
        const query = document.getElementById('searchInput').value.trim().toLowerCase();
        
        const filtered = gamesData.filter(game => {
            const matchesCat = (currentCategory === '전체') || (game.cat === currentCategory);
            const matchesQuery = game.name.toLowerCase().includes(query) || game.cat.toLowerCase().includes(query);
            return matchesCat && matchesQuery;
        });

        renderGames(filtered);
    }

    function shareSite() {
        const shareData = {
            title: '🎮 추억의 게임방',
            text: '심심할 때 즐기는 추억의 게임 모음집! 바로 와서 플레이해보세요.',
            url: window.location.href
        };

        if (navigator.share) {
            navigator.share(shareData).catch(() => {});
        } else {
            navigator.clipboard.writeText(window.location.href).then(() => {
                showToast("링크가 클립보드에 복사되었습니다!");
            }).catch(() => {
                showToast("주소창의 링크를 복사해 공유해 주세요!");
            });
        }
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        document.getElementById('toastMsg').innerText = msg;
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 2500);
    }

    document.addEventListener('DOMContentLoaded', () => {
        renderGames(gamesData);
    });
</script>
 </body>
</html>
