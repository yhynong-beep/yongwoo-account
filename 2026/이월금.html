<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>용우회 이월금</title>
<meta property="og:title" content="용우회 이월금">
<meta property="og:description" content="2026.03.21 기준 이월금 2,773,630원">
<style>
:root{
  --bg1:#1b1f4b; --bg2:#4b2a8a; --card:rgba(255,255,255,.96); --ink:#1d1f3a; --sub:#6b6f8f;
  --in:#1f6fe0; --out:#d63a3a; --line:#e8e9f4; --gold:#ffd86b;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#fff;-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  color:var(--ink);
  background:#fff;
  min-height:100vh;
  padding:max(20px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom));
}
.wrap{max-width:480px;margin:0 auto}
header{text-align:center;color:#fff;padding:20px 12px 18px;margin-bottom:14px;border-radius:22px;background:linear-gradient(135deg,#22205c 0%,#27206c 100%);box-shadow:0 6px 18px rgba(34,32,92,.22)}
header .badge{display:inline-block;font-size:12px;letter-spacing:.12em;padding:5px 12px;border-radius:999px;background:#efeaff;color:#5a35c8;margin-bottom:12px}
header h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
header p{margin-top:6px;font-size:13px;color:rgba(255,255,255,.85)}

.hero{
  background:linear-gradient(135deg,#fff 0%,#f1efff 100%);
  border-radius:24px;padding:14px 18px 12px;text-align:center;
  border:1px solid var(--line);box-shadow:0 6px 20px rgba(60,40,140,.12);position:relative;overflow:hidden;
}
.hero::before{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(123,92,230,.22),transparent 70%)}
.hero .label{font-size:14px;color:var(--sub);font-weight:600}
.hero .amount{font-size:40px;font-weight:800;letter-spacing:-.03em;margin:2px 0 0;line-height:1.2;
  background:linear-gradient(90deg,#2a2f8f,#7b3fe4);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .amount small{font-size:22px;font-weight:700;margin-left:2px}
.hero .date{font-size:12.5px;color:var(--sub)}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.stat{background:var(--card);border-radius:18px;padding:16px 14px;text-align:center;border:1px solid var(--line);box-shadow:0 4px 14px rgba(60,40,140,.08)}
.stat .t{font-size:12.5px;color:var(--sub);font-weight:600}
.stat .v{font-size:20px;font-weight:800;margin-top:6px;letter-spacing:-.02em}
.stat.in .v{color:var(--in)}
.stat.out .v{color:var(--out)}

.card{background:var(--card);border-radius:22px;margin-top:14px;padding:20px 18px 8px;border:1px solid var(--line);box-shadow:0 4px 14px rgba(60,40,140,.08)}
.card h2{font-size:16px;font-weight:800;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:5px;height:16px;border-radius:3px;background:linear-gradient(#4b6bff,#8a3fe4)}
.period{font-size:12.5px;color:var(--sub);margin:0 0 6px 13px}

.tx{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:15px 0;border-top:1px solid var(--line)}
.tx:first-of-type{border-top:none}
.tx .l{min-width:0}
.tx .name{font-size:16px;font-weight:700}
.tx .when{font-size:12px;color:var(--sub);margin-top:3px}
.tx .r{text-align:right;flex-shrink:0}
.tx .amt{font-size:17px;font-weight:800;letter-spacing:-.01em}
.tx .amt.in{color:var(--in)}
.tx .amt.out{color:var(--out)}
.tx .bal{font-size:12px;color:var(--sub);margin-top:3px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:2px}
.tag.in{background:#e6f0ff;color:var(--in)}
.tag.out{background:#ffe9e9;color:var(--out)}

.photo{margin-top:14px;background:var(--card);border-radius:22px;padding:14px 14px 14px;border:1px solid var(--line);box-shadow:0 4px 14px rgba(60,40,140,.08)}
.photo .cap{font-size:15px;font-weight:800;margin:4px 4px 12px;display:flex;justify-content:space-between;align-items:center}
.photo .cap span{font-size:12px;font-weight:600;color:var(--sub)}
.photo img{display:block;width:100%;height:auto;border-radius:14px;border:1px solid var(--line)}
footer{text-align:center;color:var(--sub);font-size:12px;margin-top:22px;line-height:1.7}
</style>
</head>
